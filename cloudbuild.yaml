steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/helpdesk-repo/helpdesk-api:latest'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/helpdesk-repo/helpdesk-api:stable'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/helpdesk-repo/helpdesk-api:latest'
    waitFor: ['build']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-stable'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/helpdesk-repo/helpdesk-api:stable'
    waitFor: ['build']

  - name: 'ubuntu'
    id: 'patch-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i "s/PROJECT_ID/$PROJECT_ID/g" k8s/stable-deployment.yaml k8s/canary-deployment.yaml
    waitFor: ['push-latest']

  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud container clusters get-credentials helpdesk-cluster --zone=us-central1-a --project=$PROJECT_ID
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=helpdesk-cluster'
    waitFor: ['patch-image']

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/helpdesk-repo/helpdesk-api:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/helpdesk-repo/helpdesk-api:stable'

timeout: '1800s'
