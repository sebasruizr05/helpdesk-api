# Servicio común para ambos deployments (stable y canary).
# El selector app: helpdesk-api coincide con los pods de ambos deployments,
# por lo que el Service balancea el tráfico entre todos los pods disponibles.
# Con 3 réplicas stable y 1 canary → distribución aproximada 75% / 25%.
apiVersion: v1
kind: Service
metadata:
  name: helpdesk-service
  namespace: helpdesk
  labels:
    app: helpdesk-api
spec:
  selector:
    app: helpdesk-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
