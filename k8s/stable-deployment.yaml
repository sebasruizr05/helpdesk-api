# Deployment estable - recibe ~75% del tráfico (3 de 4 réplicas totales).
# Ambos deployments comparten el label app: helpdesk-api, que es el selector
# del Service común. La distribución de tráfico es proporcional a las réplicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-stable
  namespace: helpdesk
  labels:
    app: helpdesk-api
    track: stable
    version: "2.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: helpdesk-api
      track: stable
  template:
    metadata:
      labels:
        app: helpdesk-api
        track: stable
        version: "2.0.0"
    spec:
      containers:
        - name: helpdesk-api
          # Reemplazar helpdesk-api-492703 con el ID real del proyecto GCP
          image: us-central1-docker.pkg.dev/helpdesk-api-492703/helpdesk-repo/helpdesk-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DEPLOY_TYPE
              value: "stable"
            - name: APP_VERSION
              value: "2.0.0"
            - name: ENVIRONMENT
              value: "production"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DEBUG
              value: "False"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: helpdesk-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: helpdesk-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helpdesk-secrets
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: helpdesk-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: helpdesk-secrets
                  key: DB_PORT
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: helpdesk-secrets
                  key: SECRET_KEY
            - name: ALLOWED_HOSTS
              valueFrom:
                secretKeyRef:
                  name: helpdesk-secrets
                  key: ALLOWED_HOSTS
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
